name: Agent Plugin Tests

on:
  pull_request:
    paths:
      - "plugin/**"
      - "scripts/validate-agent-plugins.sh"
      - "tests/opencode-plugin.test.mjs"
      - ".github/workflows/agent-plugins.yml"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "scripts/validate-agent-plugins.sh"
      - "tests/opencode-plugin.test.mjs"
      - ".github/workflows/agent-plugins.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: bash scripts/validate-agent-plugins.sh
      - run: node --test tests/opencode-plugin.test.mjs
